<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 220" width="820" height="220" role="img" aria-labelledby="spLogoTitle spLogoDesc">
  <title id="spLogoTitle">SAFE-PARKS CISO Portal</title>
